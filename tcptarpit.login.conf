# tcptarpit login class - installed by the package as
# /etc/login.conf.d/tcptarpit and registered with cap_mkdb(1).
#
# The file must be self-contained: cap_mkdb builds it on its own, so
# no tc= interpolation from /etc/login.conf is possible here.
tcptarpit:\
	:ignorenologin:\
	:datasize=4096M:\
	:openfiles-cur=1024:\
	:openfiles-max=4096:
